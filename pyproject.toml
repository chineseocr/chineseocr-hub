[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chineseocr-hub"
version = "0.6.0a1"
description = "Multimodal OCR, multi-document recognition and schema-driven extraction"
requires-python = ">=3.12"
dynamic = ["dependencies"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
chineseocr-hub = "workbench.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.setuptools.package-data]
workbench = ["static/*", "static/locales/*.json", "starter_schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
